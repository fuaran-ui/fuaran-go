# Build, test and wire-format conformance gate for the Go host.
#
# ── Layout ───────────────────────────────────────────────────────────────────
# The conformance corpus is its own public repository. The test suite locates it
# by walking up from the repo root looking for `wire-format-fixtures/manifest.json`,
# so this repo is checked out into a subdirectory and the corpus beside it:
#
#     $GITHUB_WORKSPACE/
#     ├── fuaran-go/               ← this repo
#     └── wire-format-fixtures/    ← the corpus (fuaran-ui/fuaran-ui-specification)
#
# The corpus repository is PUBLIC, so the checkout is anonymous — no token.
#
# ── Why the corpus assertion below is not optional ───────────────────────────
# Every corpus-dependent test calls t.Skip when the corpus is absent, so a
# layout drift would not fail the job — it would silently retire the entire
# conformance leg and report green. The assertion turns that into a hard stop.
#
# ── What replaced the quarantine ─────────────────────────────────────────────
# This job used to carry a `go test -skip` quarantine: two env patterns naming
# eight whole tests and three fixtures. A skip pattern is structurally incapable
# of telling you it has stopped matching anything, and this one had: the three
# fixtures it named (form-toggle, now-environment-binding, switch-on-selection)
# were adopted by the decoder on 2026-08-11, so it was excluding eight set-level
# tests to suppress three cases that had passed for weeks — and hiding the nine
# genuine failures it never mentioned.
#
# The gate is now `cmd/conformance-residue`: it runs the WHOLE suite with no
# exclusions and compares what failed against the named set in
# conformance/RESIDUE.txt, going red in BOTH directions — an unnamed failure is
# a regression, and a named entry that now passes is a stale cap. The second
# direction is the one a skip list could never report.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-go
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-go

      # Deliberately UNPINNED: the corpus is the shared conformance authority
      # every host certifies against, and one current spec for all hosts is the
      # point of giving it a single home. Pinning here would let this host drift
      # from the spec without anything going red.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: fuaran-go/go.mod

      # gofmt is this repo's formatting gate. `gofmt -l` lists unformatted files
      # and exits 0, so the emptiness of its output is the assertion.
      - name: Format check (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files. Run 'gofmt -w .' before committing."
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Print what this gate does NOT block on, on every run. A cap nobody can
      # see reads as "covered everything".
      - name: Report the conformance residue
        run: |
          echo "The blocking gate below runs the WHOLE suite and permits ONLY these"
          echo "named failures (conformance/RESIDUE.txt):"
          echo
          grep -vE '^[[:space:]]*(#|$)' conformance/RESIDUE.txt | sed 's/^/  /'
          echo
          echo "ALSO NOT GATED HERE — inert rather than capped:"
          echo "  - the class-vocabulary parity oracle reads the reference host's source"
          echo "    from a sibling checkout this workflow does not make, so it Skipf's and"
          echo "    asserts NOTHING in CI. (This repo has been bitten by that before: a"
          echo "    sibling rename left the same oracles skipping silently for as long as"
          echo "    the stale path stood — see the comment above referenceHostNames.)"
          echo "    Cross-host parity is covered by the scheduled cross-implementation"
          echo "    run, not by this gate."
          {
            echo "### Conformance residue (permitted failures, named)"
            echo
            echo "Each line is a known, understood failure against the current corpus."
            echo "An unnamed failure reds the gate; so does a named one that starts passing."
            echo
            echo '```'
            grep -vE '^[[:space:]]*(#|$)' conformance/RESIDUE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE — the whole suite, no exclusions, measured against the named
      # residue set. `-count=1` is inside the runner: the corpus is a sibling
      # checkout OUTSIDE this module, so Go's test cache cannot see it change and
      # a cached PASS could otherwise stand in for a run against a moved corpus.
      - name: Test (gated — full suite vs the named residue)
        run: go run ./cmd/conformance-residue

      # THE LAUNCHER'S OWN GO-RED PROOF (Phase 1673).
      #
      # `run.ps1` is what a developer runs, and for a time it could not fail:
      # it ended `go test ./...` with no `$LASTEXITCODE` check, so
      # `pwsh -File ./run.ps1` returned 0 against a red suite. Asserting the exit
      # code fixed it; nothing asserted that the fix HOLDS, and a green launcher
      # looks identical whether it can go red or not. This step breaks each stage
      # in turn, in a scratch package, and requires the launcher to report it to
      # its CALLER — the only reading that means anything (in-session,
      # `$LASTEXITCODE` reflects the last NATIVE command, not the script's exit,
      # which is how two honest observers once reported opposite verdicts).
      #
      # Red direction only: the green direction is what every other step here
      # already demonstrates. Costs one extra full-suite run.
      - name: Launcher self-test (run.ps1 must go red at the process boundary)
        shell: pwsh
        run: ./run.tests.ps1

      # The gate's own go-red proof. It re-runs the comparison against two
      # deliberately wrong residue sets — one missing a current failure (a
      # regression), one naming a test that cannot fail (a stale cap) — and fails
      # if either goes unnoticed. Without it, a bug that made the failure set come
      # back empty would leave this job green forever.
      - name: Gate self-test (it must go red in both directions)
        run: go run ./cmd/conformance-residue -selftest

      # THE RACE DETECTOR.
      #
      # `serverdriven`'s connection-guarding tests were WRITTEN for `-race` and
      # no gate anywhere ran it, so the property they exist to hold — that two
      # goroutines cannot both be inside a channel's connection state — was
      # being asserted by tests that cannot observe it. The detector needs cgo
      # and a C toolchain, which the machine those tests were written on did not
      # have (they were verified by falsification instead: remove the mutex and
      # the assertions fail on their own arithmetic). An `ubuntu-latest` runner
      # has gcc, so the leg belongs here rather than in `run.ps1`, where it
      # would fail for want of a compiler on a stock Windows dev box.
      #
      # Scoped to the concurrent packages, not `./...`: `-race` costs several
      # times the wall clock of a plain run, and every other package in this
      # module is single-goroutine by construction, so a whole-module run would
      # buy nothing for the time. Widen it when a second package grows a
      # goroutine.
      #
      # Not folded into the residue gate above: that gate compares a failure SET
      # against a named residue list, and a race report is not a test failure it
      # can name — the detector fails the process. Separate step, separate
      # signal.
      - name: Test (race detector — the concurrent packages)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./serverdriven/ ./opstream/
